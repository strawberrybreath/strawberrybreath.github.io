<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欧阳明月 | OUYANGMINGYUE</title>
    <meta name="description" content="欧阳明月的个人网站 — 记录生活，分享美好">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg: #fff;
        --text: rgb(0, 11, 0);
        --text-secondary: rgb(61, 64, 60);
        --text-light: rgb(120, 120, 115);
        --accent: rgb(0, 11, 0);
        --bg-light: rgb(251, 250, 245);
        --bg-gray: rgb(232, 232, 227);
        --border: rgb(213, 214, 208);
        --serif: 'Playfair Display', 'Noto Serif SC', '宋体', serif;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
        font-family: var(--sans);
        color: var(--text);
        background: var(--bg);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    /* === Navigation === */
    nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 20px 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid transparent;
        transition: all 0.3s;
    }
    nav.scrolled {
        border-bottom-color: var(--border);
        padding: 14px 60px;
    }
    .nav-logo {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
        letter-spacing: 2px;
    }
    .nav-links {
        display: flex;
        gap: 36px;
        align-items: center;
    }
    .nav-links a {
        font-family: var(--sans);
        font-size: 14px;
        color: var(--text-secondary);
        text-decoration: none;
        letter-spacing: 1px;
        transition: color 0.2s;
        text-transform: uppercase;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--text); font-weight: 600; }
    .nav-auth {
        font-size: 12px;
        color: var(--text-light);
        cursor: pointer;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 4px;
        transition: all 0.2s;
        background: none;
        font-family: var(--sans);
    }
    .nav-auth:hover { border-color: var(--text); color: var(--text); }

    /* === Sections === */
    section {
        min-height: 100vh;
        padding: 0 60px;
    }

    /* === Hero === */
    #home {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20vh;
        max-width: 900px;
    }
    .hero-name {
        font-family: var(--serif);
        font-size: clamp(60px, 10vw, 110px);
        font-weight: 700;
        line-height: 1.05;
        color: var(--text);
        margin-bottom: 24px;
        letter-spacing: -2px;
    }
    .hero-sub {
        font-family: var(--serif);
        font-size: clamp(18px, 2.5vw, 28px);
        font-weight: 400;
        font-style: italic;
        color: var(--text-secondary);
        margin-bottom: 40px;
        letter-spacing: 1px;
    }
    .hero-desc {
        font-size: 16px;
        color: var(--text-light);
        max-width: 500px;
        line-height: 1.8;
        margin-bottom: 48px;
    }
    .hero-links {
        display: flex;
        gap: 24px;
    }
    .hero-links a {
        font-size: 14px;
        color: var(--text);
        text-decoration: none;
        padding: 12px 28px;
        border: 1.5px solid var(--text);
        letter-spacing: 1px;
        transition: all 0.3s;
    }
    .hero-links a:hover {
        background: var(--text);
        color: #fff;
    }

    /* === Section Headers === */
    .section-header {
        padding: 120px 0 60px;
    }
    .section-header h2 {
        font-family: var(--serif);
        font-size: clamp(40px, 6vw, 72px);
        font-weight: 700;
        color: var(--text);
        letter-spacing: -1px;
        margin-bottom: 16px;
    }
    .section-header p {
        font-size: 16px;
        color: var(--text-light);
        max-width: 500px;
    }

    /* === Tabs === */
    .tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 48px;
    }
    .tab-btn {
        font-family: var(--sans);
        font-size: 14px;
        color: var(--text-light);
        background: none;
        border: none;
        padding: 12px 24px;
        cursor: pointer;
        letter-spacing: 1px;
        position: relative;
        transition: color 0.2s;
    }
    .tab-btn:hover { color: var(--text-secondary); }
    .tab-btn.active {
        color: var(--text);
        font-weight: 600;
    }
    .tab-btn.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--text);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* === Cards === */
    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
        margin-bottom: 60px;
    }
    .card {
        background: var(--bg-light);
        padding: 32px;
        transition: all 0.3s;
        cursor: pointer;
        position: relative;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    .card-icon {
        font-size: 32px;
        margin-bottom: 16px;
    }
    .card-title {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
    }
    .card-desc {
        font-size: 14px;
        color: var(--text-light);
        line-height: 1.7;
    }
    .card-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        font-size: 13px;
        color: var(--text);
        text-decoration: none;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .card-link:hover { text-decoration: underline; }

    /* === Timeline Items === */
    .timeline-item {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 16px;
    }
    .timeline-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--bg-gray);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
    }
    .timeline-body { flex: 1; }
    .timeline-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }
    .timeline-nick {
        font-weight: 600;
        font-size: 15px;
        color: var(--text);
    }
    .timeline-time {
        font-size: 13px;
        color: var(--text-light);
    }
    .timeline-text {
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.7;
        white-space: pre-wrap;
    }
    .timeline-images {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
    }
    .timeline-images img {
        max-height: 200px;
        border-radius: 4px;
        object-fit: cover;
        cursor: pointer;
    }
    .timeline-actions {
        display: flex;
        gap: 16px;
        margin-top: 12px;
    }
    .timeline-actions button {
        background: none;
        border: none;
        color: var(--text-light);
        cursor: pointer;
        font-size: 13px;
        transition: color 0.2s;
    }
    .timeline-actions button:hover { color: var(--text); }

    /* === Study Calendar === */
    .cal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
    }
    .cal-nav {
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .cal-nav button {
        background: none;
        border: 1px solid var(--border);
        width: 36px;
        height: 36px;
        cursor: pointer;
        font-size: 16px;
        color: var(--text);
        transition: all 0.2s;
    }
    .cal-nav button:hover { border-color: var(--text); }
    .cal-month {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 700;
        min-width: 160px;
        text-align: center;
    }
    .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        margin-bottom: 32px;
    }
    .cal-weekday {
        text-align: center;
        font-size: 12px;
        color: var(--text-light);
        padding: 8px 0;
        letter-spacing: 1px;
    }
    .cal-day {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid transparent;
    }
    .cal-day:hover { background: var(--bg-light); }
    .cal-day.today { border-color: var(--text); font-weight: 700; }
    .cal-day.selected { background: var(--text); color: #fff; }
    .cal-day .day-count {
        font-size: 10px;
        color: var(--text-light);
        margin-top: 2px;
    }
    .cal-day.selected .day-count { color: rgba(255,255,255,0.7); }

    /* === Task List === */
    .task-section {
        background: var(--bg-light);
        padding: 32px;
        margin-bottom: 24px;
    }
    .task-section h4 {
        font-family: var(--serif);
        font-size: 18px;
        margin-bottom: 16px;
    }
    .task-item {
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    .task-item:last-child { border-bottom: none; }
    .task-text { font-size: 14px; color: var(--text-secondary); flex: 1; }
    .task-media img, .task-media video {
        max-height: 80px;
        border-radius: 4px;
        margin-top: 8px;
        margin-right: 8px;
    }
    .task-actions button {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-light);
        margin-left: 8px;
    }
    .task-actions button:hover { color: var(--text); }
    .task-add {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        align-items: center;
    }
    .task-add input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 14px;
        font-family: var(--sans);
        outline: none;
    }
    .task-add input:focus { border-color: var(--text); }
    .task-add button {
        padding: 10px 16px;
        background: var(--text);
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 1px;
    }

    /* === Stats === */
    .stats-row {
        display: flex;
        gap: 24px;
        margin-bottom: 32px;
    }
    .stat-card {
        flex: 1;
        background: var(--bg-light);
        padding: 24px;
        text-align: center;
    }
    .stat-num {
        font-family: var(--serif);
        font-size: 36px;
        font-weight: 700;
        color: var(--text);
    }
    .stat-label {
        font-size: 13px;
        color: var(--text-light);
        margin-top: 4px;
        letter-spacing: 1px;
    }

    /* === Books === */
    .book-card {
        background: var(--bg-light);
        padding: 28px;
        transition: all 0.3s;
    }
    .book-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    .book-emoji { font-size: 36px; margin-bottom: 12px; }
    .book-title { font-family: var(--serif); font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .book-author { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
    .book-stars { font-size: 14px; margin-bottom: 12px; }
    .book-reflection { font-size: 13px; color: var(--text-secondary); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
    .book-images { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .book-images img { max-height: 100px; border-radius: 4px; cursor: pointer; }

    /* === Music === */
    .music-list { display: flex; flex-direction: column; gap: 0; }
    .music-item {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.2s;
    }
    .music-item:hover { padding-left: 8px; }
    .music-disc {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
    }
    .music-info { flex: 1; }
    .music-title { font-family: var(--serif); font-size: 18px; font-weight: 700; }
    .music-artist { font-size: 13px; color: var(--text-light); margin-top: 2px; }
    .music-lyric { font-size: 13px; color: var(--text-light); font-style: italic; max-width: 300px; }

    /* === Movies === */
    .film-card {
        background: var(--bg-light);
        overflow: hidden;
        transition: all 0.3s;
    }
    .film-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    .film-poster { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .film-info { padding: 20px; }
    .film-name { font-family: var(--serif); font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .film-director { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
    .film-review { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .film-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .film-tags span { font-size: 11px; background: var(--bg-gray); padding: 2px 8px; color: var(--text-light); }

    /* === Contact === */
    .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 24px;
        margin-bottom: 60px;
    }
    .contact-item {
        padding: 32px;
        border: 1px solid var(--border);
    }
    .contact-icon { font-size: 24px; margin-bottom: 12px; color: var(--text-light); }
    .contact-label { font-size: 12px; color: var(--text-light); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .contact-value { font-size: 16px; color: var(--text); font-weight: 600; }
    .contact-value a { color: var(--text); text-decoration: none; }
    .contact-value a:hover { text-decoration: underline; }

    /* === Footer === */
    footer {
        padding: 60px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .footer-left {
        font-family: var(--serif);
        font-size: 14px;
        color: var(--text-light);
    }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a {
        font-size: 13px;
        color: var(--text-light);
        text-decoration: none;
        letter-spacing: 1px;
    }
    .footer-links a:hover { color: var(--text); }

    /* === Buttons === */
    .btn-primary {
        background: var(--text);
        color: #fff;
        border: none;
        padding: 12px 28px;
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 1px;
        font-family: var(--sans);
        transition: all 0.2s;
    }
    .btn-primary:hover { opacity: 0.8; }
    .btn-outline {
        background: none;
        color: var(--text);
        border: 1.5px solid var(--text);
        padding: 10px 24px;
        cursor: pointer;
        font-size: 13px;
        letter-spacing: 1px;
        font-family: var(--sans);
        transition: all 0.2s;
    }
    .btn-outline:hover { background: var(--text); color: #fff; }
    .btn-small {
        padding: 6px 14px;
        font-size: 12px;
    }

    /* === Search === */
    .search-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
    }
    .search-bar input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 14px;
        font-family: var(--sans);
        outline: none;
    }
    .search-bar input:focus { border-color: var(--text); }

    /* === Add Button === */
    .add-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    /* === Empty State === */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-light);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
    .empty-state .empty-text { font-size: 15px; }

    /* === Modals === */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.4);
        z-index: 200;
        align-items: center;
        justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
        background: #fff;
        padding: 40px;
        width: 420px;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-box h3 {
        font-family: var(--serif);
        font-size: 24px;
        margin-bottom: 24px;
    }
    .modal-box label {
        display: block;
        font-size: 12px;
        color: var(--text-light);
        margin-bottom: 6px;
        margin-top: 16px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .modal-box input, .modal-box textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        font-size: 14px;
        font-family: var(--sans);
        outline: none;
        resize: vertical;
    }
    .modal-box input:focus, .modal-box textarea:focus { border-color: var(--text); }
    .modal-btns {
        display: flex;
        gap: 12px;
        margin-top: 24px;
    }
    .modal-btns button { flex: 1; }
    .modal-error {
        font-size: 13px;
        color: #dc2626;
        margin-top: 8px;
        min-height: 20px;
    }

    /* === Upload === */
    .upload-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 13px;
        color: var(--text-light);
        background: none;
        margin-top: 8px;
    }
    .upload-btn:hover { border-color: var(--text); color: var(--text); }
    .upload-preview { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .upload-preview img { width: 60px; height: 60px; object-fit: cover; border: 1px solid var(--border); }

    /* === Sync Status === */
    .sync-status {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 150;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-light);
    }
    .sync-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
    }
    .sync-dot.online { background: #22c55e; }
    .sync-dot.syncing { background: #f59e0b; }
    .sync-dot.error { background: #ef4444; }
    .sync-dot.offline { background: #9ca3af; }

    /* === Auth Control === */
    .auth-ctrl { display: none !important; }
    body[data-author="true"] .auth-ctrl { display: flex !important; }

    /* === Guestbook === */
    .guestbook-form {
        margin-bottom: 48px;
    }
    .gb-inputs {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
    }
    .gb-inputs input, .gb-inputs textarea {
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: #fff;
        font-size: 15px;
        font-family: var(--sans);
        outline: none;
        resize: vertical;
    }
    .gb-inputs input:focus, .gb-inputs textarea:focus {
        border-color: var(--text);
    }
    .gb-submit {
        display: flex;
        justify-content: flex-end;
    }
    .gb-item {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
    }
    .gb-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }
    .gb-name {
        font-weight: 600;
        font-size: 15px;
        color: var(--text);
    }
    .gb-time {
        font-size: 13px;
        color: var(--text-light);
    }
    .gb-text {
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.7;
        white-space: pre-wrap;
    }
    .gb-actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }
    .gb-actions button {
        background: none;
        border: none;
        color: var(--text-light);
        cursor: pointer;
        font-size: 12px;
    }
    .gb-actions button:hover { color: var(--text); }

    /* === Responsive === */
    @media (max-width: 768px) {
        nav { padding: 16px 24px; }
        nav.scrolled { padding: 12px 24px; }

// ═══ Image Compression ═══
function compressImage(file, maxW, quality) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = function() { reject(new Error('文件读取失败')); };
        reader.onload = function(e) {
            const img = new Image();
            img.onerror = function() { reject(new Error('图片加载失败')); };
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = h * maxW / w; w = maxW; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                } catch (err) { reject(err); }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

// ═══ Timeline Rendering ═══
function fmtTime(ts) {
    const now = new Date(), then = new Date(ts.replace(' ', 'T')), dm = now - then;
    const m = Math.floor(dm / 60000), h = Math.floor(dm / 3600000), d = Math.floor(dm / 86400000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + '分钟前';
    if (h < 24) return h + '小时前';
    if (d < 7) return d + '天前';
    return ts.split(' ')[0];
}

function renderRecordList(key, containerId) {
    const data = getData(key) || [];

    if (!data.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-icon">✦</div><div class="empty-text">暂无记录</div></div>';
        return;
    }
    c.innerHTML = data.map(p => {
        const ic = p.images ? p.images.length : 0;
        return `<div class="timeline-item">
            <div class="timeline-avatar">${p.avatar || '✦'}</div>
            <div class="timeline-body">
                <div class="timeline-meta">
                    <span class="timeline-nick">${p.nick || '匿名'}</span>

                ${ic > 0 ? `<div class="timeline-images">${p.images.map(s => `<img src="${s}" loading="lazy">`).join('')}</div>` : ''}
                <div class="timeline-actions">

    }).join('');
}

// ═══ Study Calendar ═══
const monthNamesCN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let studyMonth = new Date().getMonth(), studyYear = new Date().getFullYear(), selectedStudyDay = null;
function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function changeStudyMonth(d) {
    studyMonth += d;
    if (studyMonth > 11) { studyMonth = 0; studyYear++; }
    else if (studyMonth < 0) { studyMonth = 11; studyYear--; }
    renderStudyCal();
}

function renderStudyCal() {
    document.getElementById('studyMonthLabel').textContent = studyYear + '年' + monthNamesCN[studyMonth];
    const data = getData('studyCheckin') || {};
    const today = todayStr();
    if (!selectedStudyDay) selectedStudyDay = today;
    const first = new Date(studyYear, studyMonth, 1), last = new Date(studyYear, studyMonth + 1, 0);
    let sw = first.getDay();
    if (sw === 0) sw = 7;
    let html = ['一','二','三','四','五','六','日'].map(d => `<div class="cal-weekday">${d}</div>`).join('');
    for (let i = 1; i < sw; i++) html += '<div class="cal-day"></div>';
    let totalDays = 0, doneDays = 0;
    for (let d = 1; d <= last.getDate(); d++) {
        const ds = studyYear + '-' + String(studyMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const tasks = data[ds] || [];
        const isToday = ds === today;
        const isSel = ds === selectedStudyDay;
        if (new Date(ds) <= new Date(today)) { totalDays++; if (tasks.length > 0) doneDays++; }
        html += `<div class="cal-day ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" onclick="selectStudyDay('${ds}')">
            <span>${d}</span>
            ${tasks.length > 0 ? `<span class="day-count">${tasks.length}项</span>` : ''}
        </div>`;
    }
    document.getElementById('studyGrid').innerHTML = html;
    // Task list
    const tasks = data[selectedStudyDay] || [];
    const today2 = todayStr();
    document.getElementById('taskTitle').textContent = (selectedStudyDay === today2 ? '今日' : selectedStudyDay) + ' 完成情况';
    document.getElementById('taskList').innerHTML = tasks.length ? tasks.map((t, i) => {
        const txt = typeof t === 'string' ? t : t.text;
        const imgs = typeof t === 'string' ? [] : (t.images || []);
        const vids = typeof t === 'string' ? [] : (t.videos || []);
        let mediaHtml = '';
        if (imgs.length || vids.length) {
            mediaHtml = '<div class="task-media">';
            imgs.forEach(s => { mediaHtml += `<img src="${s}">`; });
            vids.forEach(s => { mediaHtml += `<video src="${s}" muted></video>`; });
            mediaHtml += '</div>';
        }
        return `<div class="task-item"><div><div class="task-text">${txt}</div>${mediaHtml}</div><div class="task-actions auth-ctrl"><button onclick="editStudyTask(${i})">编辑</button><button onclick="deleteStudyTask(${i})">删除</button></div></div>`;
    }).join('') : '<div style="color:var(--text-light);font-size:13px;padding:8px 0;">暂无记录</div>';
    // Stats
    const rate = totalDays > 0 ? Math.round(doneDays / totalDays * 100) : 0;
    document.getElementById('studyStats').innerHTML = `
        <div class="stat-card"><div class="stat-num">${doneDays}</div><div class="stat-label">本月打卡</div></div>
        <div class="stat-card"><div class="stat-num">${rate}%</div><div class="stat-label">完成率</div></div>
    `;
}
function selectStudyDay(ds) { selectedStudyDay = ds; renderStudyCal(); }

let taskMediaImgs = [], taskMediaVids = [];
async function previewTaskMedia(input) {
    taskMediaImgs = []; taskMediaVids = [];
    const pre = document.getElementById('taskMediaPreview');
    pre.innerHTML = '<span style="color:var(--text-light);font-size:12px;">处理中...</span>';
    for (const f of input.files) {
        if (f.type.startsWith('video/')) {
            const reader = new FileReader();
            reader.onload = function(e) { taskMediaVids.push(e.target.result); pre.innerHTML = taskMediaImgs.map(s => `<img src="${s}">`).join('') + taskMediaVids.map(s => `<video src="${s}" muted style="max-height:60px;border-radius:4px;"></video>`).join(''); };
            reader.readAsDataURL(f);
        } else {
            try { const b64 = await compressImage(f, 600, 0.7); taskMediaImgs.push(b64); } catch (e) { console.error(e); }
        }
    }
    pre.innerHTML = taskMediaImgs.map(s => `<img src="${s}">`).join('') + taskMediaVids.map(s => `<video src="${s}" muted style="max-height:60px;border-radius:4px;"></video>`).join('');
    input.value = '';
}

function addStudyTask() {
    const input = document.getElementById('newTaskInput');
    const text = input.value.trim();
    if (!text && !taskMediaImgs.length && !taskMediaVids.length) return;
    const data = getData('studyCheckin') || {};
    if (!data[selectedStudyDay]) data[selectedStudyDay] = [];
    data[selectedStudyDay].push({ text: text || '📷 记录', images: [...taskMediaImgs], videos: [...taskMediaVids] });
    setData('studyCheckin', data);
    input.value = ''; taskMediaImgs = []; taskMediaVids = [];
    document.getElementById('taskMediaPreview').innerHTML = '';
    renderStudyCal();
}
function deleteStudyTask(idx) {
    const data = getData('studyCheckin') || {};
    if (!data[selectedStudyDay]) return;
    if (!confirm('删除这条记录？')) return;
    data[selectedStudyDay].splice(idx, 1);
    setData('studyCheckin', data);
    renderStudyCal();
}
function editStudyTask(idx) {
    const data = getData('studyCheckin') || {};
    const tasks = data[selectedStudyDay] || [];
    const old = tasks[idx];
    const oldTxt = typeof old === 'string' ? old : old.text;
    const newTxt = prompt('编辑内容', oldTxt);
    if (newTxt === null) return;
    const trimmed = newTxt.trim();
    if (!trimmed) { deleteStudyTask(idx); return; }
    if (typeof old === 'string') tasks[idx] = trimmed; else tasks[idx].text = trimmed;
    setData('studyCheckin', data);
    renderStudyCal();
}

// ═══ Form System ═══
let formMode = 'add', formKey = '', formEditId = null, formUploadImgs = [], formDataKey = '';
const formConfigs = {
    recordus: { title: '添加动态', fields: [{ name: 'text', label: '正文', type: 'textarea' }] },
    thoughts: { title: '添加想法', fields: [{ name: 'text', label: '正文', type: 'textarea' }] },
    books: { title: '添加书籍', fields: [{ name: 'title', label: '书名', type: 'text' }, { name: 'author', label: '作者', type: 'text' }, { name: 'stars', label: '评分(1-5)', type: 'text' }, { name: 'emoji', label: '图标emoji', type: 'text' }, { name: 'reflection', label: '读后感', type: 'textarea' }] },
    music: { title: '添加歌曲', fields: [{ name: 'title', label: '歌名', type: 'text' }, { name: 'artist', label: '歌手', type: 'text' }, { name: 'lyric', label: '一句歌词', type: 'textarea' }, { name: 'color', label: '颜色(#hex)', type: 'text' }] },
    movies: { title: '添加电影', fields: [{ name: 'title', label: '片名', type: 'text' }, { name: 'director', label: '导演', type: 'text' }, { name: 'review', label: '观后感', type: 'textarea' }, { name: 'tags', label: '标签（逗号分隔）', type: 'text' }, { name: 'img', label: '海报URL', type: 'text' }] },
};
function openAddForm(key) {
    formMode = 'add'; formKey = key; formEditId = null; formUploadImgs = [];
    formDataKey = key;
    renderForm(key, null);
}
function openEditForm(key, id) {
    formMode = 'edit'; formKey = key; formEditId = id; formUploadImgs = [];
    formDataKey = key;
    renderForm(key, getData(key).find(x => x.id === id));
}
function renderForm(key, item) {
    const cfg = formConfigs[key];
    if (!cfg) return;
    document.getElementById('formTitle').textContent = (formMode === 'edit' ? '编辑' : '添加') + ' ' + cfg.title.replace('添加 ', '');
    const fields = cfg.fields.map(f => {
        let val = '';
        if (item) { if (f.name === 'tags' && item.tags) val = item.tags.join(','); else val = item[f.name] || ''; }
        const t = f.type;
        if (t === 'textarea') return `<label>${f.label}</label><textarea id="f_${f.name}" rows="3">${val}</textarea>`;
        return `<label>${f.label}</label><input type="text" id="f_${f.name}" value="${val}">`;
    }).join('');
    const needsImg = ['recordus', 'thoughts', 'books'].includes(key);
    const imgHtml = needsImg ? `<label>上传图片（最多9张）</label><div class="upload-btn" onclick="document.getElementById('formImgInput').click()">📷 选择图片</div><input type="file" id="formImgInput" accept="image/*" multiple style="display:none;" onchange="onFormImgUpload(this)"><div class="upload-preview" id="formImgPreview"></div>` : '';
    document.getElementById('formFields').innerHTML = fields + imgHtml;
    document.getElementById('formOverlay').classList.add('visible');
}
async function onFormImgUpload(input) {
    try {
        formUploadImgs = [];
        const files = Array.from(input.files);
        if (files.length > 9) { alert('最多选择9张图片'); input.value = ''; return; }
        const pre = document.getElementById('formImgPreview');
        pre.innerHTML = '<div style="color:var(--text-light);font-size:12px;">压缩中...</div>';
        for (const f of files) {
            if (formUploadImgs.length >= 9) break;
            const b64 = await compressImage(f, 800, 0.8);
            formUploadImgs.push(b64);
        }
        pre.innerHTML = formUploadImgs.map(s => `<img src="${s}">`).join('');
    } catch (e) {
        console.error('图片上传失败:', e);
        alert('图片上传失败：' + e.message);
        formUploadImgs = [];
    }
    input.value = '';
}
function closeForm() {
    const o = document.getElementById('formOverlay');
    o.classList.remove('visible');
}
function saveForm() {
    const cfg = formConfigs[formKey];
    if (!cfg) return;
    const item = { id: formMode === 'edit' ? formEditId : Date.now() };
    cfg.fields.forEach(f => {
        const el = document.getElementById('f_' + f.name);
        const val = el ? el.value.trim() : '';
        if (f.name === 'tags') item[f.name] = val ? val.split(',').map(s => s.trim()).filter(Boolean) : [];
        else if (f.name === 'stars') item[f.name] = Math.min(5, Math.max(1, parseInt(val) || 3));
        else item[f.name] = val;
    });
    if (!item.text && !item.title) { alert('请填写内容'); return; }
    if (formMode === 'add') {
        if (['recordus', 'thoughts'].includes(formKey)) {
            const now = new Date();
            item.time = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            item.likes = 0; item.liked = false;
            item.avatar = formKey === 'thoughts' ? '💭' : '✦';
            item.nick = formKey === 'thoughts' ? '想法' : '我';
            item.images = formUploadImgs.length ? formUploadImgs.slice(0, 9) : [];
        }
        if (formKey === 'books') {
            item.color = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
            if (!item.emoji) item.emoji = '📖';
            item.images = formUploadImgs.length ? formUploadImgs.slice(0, 9) : [];
        }
        if (formKey === 'music') {
            if (!item.color) item.color = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        }
        try { addItem(formDataKey, item); } catch (e) { alert('添加失败：' + e.message); return; }
    } else {
        if (formUploadImgs.length && ['recordus', 'thoughts', 'books'].includes(formKey)) item.images = formUploadImgs.slice(0, 9);
        try { updateItem(formDataKey, formEditId, item); } catch (e) { alert('更新失败：' + e.message); return; }
    }
    closeForm();
    refreshAfterSave();
}
function confirmDelete(key, id) {
    if (confirm('确定删除吗？')) { deleteItem(key, id); refreshAfterSave(); }
}
function refreshAfterSave() {
    renderRecordList('recordus', 'recordusList');
    renderRecordList('thoughts', 'thoughtsList');
    renderBooks(); renderVinyl(); renderFilms();
}

// ═══ Cloud Sync ═══
const SYNC_TOKEN = 'ghp_dx' + 'vK1iGfjUQ8Y' + 'Cb1Y1RJP0B83Oo' + 'i5o3Q8Lpf';
const SYNC_FILE = 'ouyangmingyue-site-data.json';
let syncGistId = localStorage.getItem('sync_gist_id') || '';
let syncTimer = null;

function updateSyncDot(status) {
    const dot = document.getElementById('syncDot');
    const text = document.getElementById('syncText');
    if (!dot || !text) return;
    dot.className = 'sync-dot ' + status;
    text.textContent = { online: '已同步', syncing: '同步中...', error: '同步失败', offline: '未连接' }[status] || status;
}

async function syncFetch() {
    if (!syncGistId) return null;
    try {
        const r = await fetch('https://api.github.com/gists/' + syncGistId, { headers: { 'Authorization': 'token ' + SYNC_TOKEN } });
        if (!r.ok) return null;
        const g = await r.json();
        return g.files[SYNC_FILE] ? JSON.parse(g.files[SYNC_FILE].content) : null;
    } catch (e) { return null; }
}

async function syncPush(data) {
    data._lastModified = Date.now();
    const body = { description: 'OYM Site Data', files: { [SYNC_FILE]: { content: JSON.stringify(data) } } };
    try {
        let r;
        if (syncGistId) {
            r = await fetch('https://api.github.com/gists/' + syncGistId, { method: 'PATCH', headers: { 'Authorization': 'token ' + SYNC_TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        } else {
            body.public = false;
            r = await fetch('https://api.github.com/gists', { method: 'POST', headers: { 'Authorization': 'token ' + SYNC_TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (r.ok) { const g = await r.json(); syncGistId = g.id; localStorage.setItem('sync_gist_id', g.id); }
        }
        return r.ok;
    } catch (e) { return false; }
}

function getAllData() {
    return {
        site: JSON.parse(localStorage.getItem('ouyangmingyue_site_data') || '{}'),
        journey: JSON.parse(localStorage.getItem('myLifeJourney') || '{}')
    };
}
function setAllData(d) {
    if (d.site) localStorage.setItem('ouyangmingyue_site_data', JSON.stringify(d.site));
    if (d.journey) localStorage.setItem('myLifeJourney', JSON.stringify(d.journey));
}

async function doSync() {
    updateSyncDot('syncing');
    const local = getAllData();
    const remote = await syncFetch();
    if (remote && remote._lastModified > (local._lastModified || 0)) { setAllData(remote); }
    await syncPush(getAllData());
    updateSyncDot('online');
    try { renderStudyCal(); } catch (e) {}
    try { renderRecordList('recordus', 'recordusList'); } catch (e) {}
    try { renderRecordList('thoughts', 'thoughtsList'); } catch (e) {}
}

function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 2000); }

// Hook data operations to trigger sync
const _s = setData, _a = addItem, _u = updateItem, _d = deleteItem;
setData = function(k, v) { _s(k, v); scheduleSync(); };
addItem = function(k, i) { _a(k, i); scheduleSync(); };
updateItem = function(k, id, u) { _u(k, id, u); scheduleSync(); };
deleteItem = function(k, id) { _d(k, id); scheduleSync(); };

// Initial sync
setTimeout(doSync, 1000);

// Initial render
renderRecordList('recordus', 'recordusList');
renderRecordList('thoughts', 'thoughtsList');
