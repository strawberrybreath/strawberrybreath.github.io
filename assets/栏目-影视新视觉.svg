 <radialGradient id="windowLight" cx="72%" cy="20%" r="72%"><stop stop-color="#f4dfc8" stop-opacity=".88"/><stop offset=".48" stop-color="#e4c0aa" stop-opacity=".22"/><stop offset="1" stop-color="#e4c0aa" stop-opacity="0"/></radialGradient>
